<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1233" />
      <stop offset="100%" stop-color="#0E071A" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#3B2660" stroke-width="2.5" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.35" />

  <!-- Stylized Solver 'X' -->
  <g filter="url(#glow)">
    <!-- Diagonal 1 (Top-Left to Bottom-Right) -->
    <path d="M34 32 L48 26 L94 96 L80 102 Z" fill="url(#primaryGrad)" />
    <!-- Diagonal 2 (Top-Right to Bottom-Left) -->
    <path d="M94 32 L80 26 L34 96 L48 102 Z" fill="url(#accentGrad)" opacity="0.9" />

    <!-- Central Fusion Core -->
    <circle cx="64" cy="64" r="7" fill="#F8FAFC" />
    <circle cx="64" cy="64" r="3.5" fill="#9333EA" />
  </g>

  <!-- Precision Corner Dots -->
  <circle cx="41" cy="29" r="2.5" fill="#C084FC" />
  <circle cx="87" cy="29" r="2.5" fill="#38BDF8" />
  <circle cx="41" cy="99" r="2.5" fill="#818CF8" />
  <circle cx="87" cy="99" r="2.5" fill="#C084FC" />
</svg>
